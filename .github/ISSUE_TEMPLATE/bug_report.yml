name: Bug report
description: 버그를 재현 가능하게 기록합니다.
title: "fix: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        ⚠️ **이 이슈 글은 그대로 Discord 알림으로 갑니다.**
        개발자가 아닌 팀원(kimabba·백과장)이 읽고 이해할 수 있게 **쉬운 한글**로 써주세요.
        전문용어는 괄호로 한 번 풀어주고, 기술 상세는 아래쪽으로 미세요.
        규칙 전문: [START-HERE.md → 5-2. PR·이슈는 쉬운 한글로 쓴다](../blob/main/docs/team/START-HERE.md)
  - type: textarea
    id: description
    attributes:
      label: 문제 설명
      description: 무엇이 잘못 동작하나요?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 재현 절차
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대 동작
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 영역
      options:
        - Flutter/UI
        - Edge Functions/API
        - DB/RLS/RPC
        - Domain/tournament/grade
        - Security/Auth/AI/RAG
        - Speed Gun/video
        - CI/Harness
        - Other
    validations:
      required: true
  - type: textarea
    id: checks
    attributes:
      label: 확인한 하네스/로그
      description: 실행한 명령, 실패 로그, 스크린샷을 붙여주세요.
