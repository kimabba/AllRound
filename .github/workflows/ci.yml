name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------
  # Flutter App Tests
  # ---------------------------------------------------------------
  flutter:
    name: Flutter
    runs-on: ubuntu-latest
    # 러너 기본값은 UTC 다. 앱은 KST 사용자를 대상으로 하고 시각 표시 테스트가
    # 로컬 타임존에 의존하므로(JY-149) 한국 시간대로 고정해 검증한다.
    env:
      TZ: Asia/Seoul
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test --coverage

  # ---------------------------------------------------------------
  # Edge Functions (Deno) Tests
  # ---------------------------------------------------------------
  edge-functions:
    name: Edge Functions (Deno)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run Deno checks
        run: >
          cd supabase/functions &&
          deno fmt --check */*.ts _shared/*.ts _shared/crawler/parsers/*.ts tests/*.ts &&
          deno lint --config deno.json */*.ts _shared/*.ts _shared/crawler/parsers/*.ts tests/*.ts &&
          deno check --config deno.json */*.ts _shared/*.ts _shared/crawler/parsers/*.ts tests/*.ts &&
          deno test --config deno.json --allow-env --allow-read tests
